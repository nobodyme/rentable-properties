name: Deploy to GitHub Pages

# Publishes the static site on every push to main (including the automated
# data/properties.json refreshes pushed by the every-2-days rental refresh
# schedule), and can be run on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "scripts/build.sh"
      - "scripts/update_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a newer refresh supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validates data/ and assembles site/ (design) + data/ (content) into _site/.
      - name: Build
        run: sh scripts/build.sh
        env:
          # Carry over the currently-live hashed CSS/JS so cached pages keep working.
          KEEP_LIVE_ASSETS: https://nobodyme.github.io/rentable-properties/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
